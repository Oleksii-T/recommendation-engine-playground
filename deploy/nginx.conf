# Example HTTP virtual host. Replace playground.example.com with your domain.
# For an existing HTTPS virtual host, copy the location block into its
# existing server block and retain its SSL certificate/listen directives.
server {
    listen 80;
    server_name playground.example.com;

    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Revalidate the app after deployments, including SPA entry pages.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }
}
